[supervisord]
nodaemon=true
logfile=/var/log/anyclaw/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:pocketbase]
command=/usr/local/bin/pocketbase serve --http=0.0.0.0:8090 --dir=/data/pocketbase/pb_data
autorestart=true
startretries=10
user=anyclaw-infra
stdout_logfile=/var/log/anyclaw/pocketbase.log
stderr_logfile=/var/log/anyclaw/pocketbase.err

[program:dispatch]
command=/anyclaw/scripts/start-dispatch.sh
directory=/anyclaw/dispatch
autorestart=true
startretries=10
user=anyclaw-infra
environment=ANYCLAW_DATA_ROOT="/data",POCKETBASE_URL="http://127.0.0.1:8090",DEV_WORKSPACE="/data/dev",PROD_WORKSPACE="/data/prod",SNAPSHOTS_DIR="/data/snapshots",INFRA_DIR="/anyclaw",HOST="0.0.0.0",PORT="4100",ANYCLAW_VERSION="0.1.0"
stdout_logfile=/var/log/anyclaw/dispatch.log
stderr_logfile=/var/log/anyclaw/dispatch.err

[program:tunnel-manager]
command=/usr/local/bin/node /anyclaw/tunnel-manager/dist/index.js
directory=/anyclaw/tunnel-manager
autorestart=true
startretries=10
user=anyclaw-infra
environment=ANYCLAW_SECRETS_DIR="/data/.anyclaw",ANYCLAW_CONNECTION_MODE="direct"
stdout_logfile=/var/log/anyclaw/tunnel-manager.log
stderr_logfile=/var/log/anyclaw/tunnel-manager.err

[program:logic-runner]
command=/usr/local/bin/node /anyclaw/logic-runner/dist/index.js
directory=/anyclaw/logic-runner
; logic-runner wraps agent-authored code, which might crash — use on-failure
; so supervisord still restarts it but does not hide a crash loop.
autorestart=unexpected
startretries=20
user=anyclaw-infra
environment=LOGIC_BUILD_DIR="/data/prod/logic-build",PORT="3000"
stdout_logfile=/var/log/anyclaw/logic-runner.log
stderr_logfile=/var/log/anyclaw/logic-runner.err

[program:prod-static]
command=/usr/local/bin/node /anyclaw/prod-static/dist/index.js
directory=/anyclaw/prod-static
autorestart=true
startretries=10
user=anyclaw-infra
environment=PROD_FRONTEND_DIR="/data/prod/frontend-build",PORT="5173"
stdout_logfile=/var/log/anyclaw/prod-static.log
stderr_logfile=/var/log/anyclaw/prod-static.err

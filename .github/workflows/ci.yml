name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  server:
    name: anyclaw-server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anyclaw-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: anyclaw-server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  broker:
    name: broker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: broker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: broker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        # testcontainers pulls a PostgreSQL image; Docker is available on ubuntu-latest runners.

  mobile:
    name: mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

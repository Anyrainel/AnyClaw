[supervisord]
nodaemon=true
logfile=/var/log/anyraven/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:pocketbase]
command=/usr/local/bin/pocketbase serve --http=0.0.0.0:8090 --dir=/data/pocketbase/pb_data
autorestart=true
startretries=10
user=anyraven-infra
stdout_logfile=/var/log/anyraven/pocketbase.log
stderr_logfile=/var/log/anyraven/pocketbase.err

[program:dispatch]
command=/anyraven/scripts/start-dispatch.sh
directory=/anyraven/dispatch
autorestart=true
startretries=10
user=anyraven-infra
environment=ANYRAVEN_DATA_ROOT="/data",POCKETBASE_URL="http://127.0.0.1:8090",DEV_WORKSPACE="/data/dev",PROD_WORKSPACE="/data/prod",SNAPSHOTS_DIR="/data/snapshots",INFRA_DIR="/anyraven",HOST="0.0.0.0",PORT="4100",ANYRAVEN_VERSION="0.1.0"
stdout_logfile=/var/log/anyraven/dispatch.log
stderr_logfile=/var/log/anyraven/dispatch.err

[program:tunnel-manager]
command=/usr/local/bin/node /anyraven/tunnel-manager/dist/index.js
directory=/anyraven/tunnel-manager
autorestart=true
startretries=10
user=anyraven-infra
environment=ANYRAVEN_SECRETS_DIR="/data/.anyraven",ANYRAVEN_CONNECTION_MODE="direct"
stdout_logfile=/var/log/anyraven/tunnel-manager.log
stderr_logfile=/var/log/anyraven/tunnel-manager.err

[program:app-backend]
command=/usr/local/bin/node /anyraven/app-backend/dist/index.js
directory=/anyraven/app-backend
; app-backend wraps agent-authored code, which might crash — use on-failure
; so supervisord still restarts it but does not hide a crash loop.
autorestart=unexpected
startretries=20
user=anyraven-infra
environment=APP_BACKEND_DIR="/data/prod/app-backend",PORT="3000"
stdout_logfile=/var/log/anyraven/app-backend.log
stderr_logfile=/var/log/anyraven/app-backend.err

[program:app-frontend]
command=/anyraven/scripts/start-app-frontend.sh
directory=/data/dev
autorestart=true
startretries=10
user=anyraven-infra
environment=ANYRAVEN_DATA_ROOT="/data",DEV_WORKSPACE="/data/dev",APP_FRONTEND_DIR="/data/prod/app-frontend",PORT="5173"
stdout_logfile=/var/log/anyraven/app-frontend.log
stderr_logfile=/var/log/anyraven/app-frontend.err
